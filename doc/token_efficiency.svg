<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" width="640" height="396" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="noTool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2887a"/>
      <stop offset="100%" stop-color="#e5484d"/>
    </linearGradient>
    <linearGradient id="withTool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd8c4"/>
      <stop offset="100%" stop-color="#3fb88f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="640" height="396" rx="16" fill="#0f1420"/>

  <text x="28" y="32" fill="#e5e7eb" font-size="18" font-weight="700">Bytes read to accomplish the same task</text>
  <text x="28" y="52" fill="#8b93a7" font-size="12">dart_context_mcp vs. grep + full-file reads &#8212; real 46-file Flutter project</text>

  <!-- legend, its own row, clear of the title/subtitle -->
  <rect x="28" y="65" width="11" height="11" rx="3" fill="url(#noTool)"/>
  <text x="45" y="74" fill="#c7cede" font-size="12">No tool</text>
  <rect x="128" y="65" width="11" height="11" rx="3" fill="url(#withTool)"/>
  <text x="145" y="74" fill="#c7cede" font-size="12">With tool</text>

  <!-- baseline -->
  <line x1="60" y1="340" x2="580" y2="340" stroke="#232b3f" stroke-width="1"/>

  <!-- Task 1 -->
  <rect x="110" y="202" width="64" height="138" rx="8" fill="url(#noTool)"/>
  <text x="142" y="190" fill="#f5989d" font-size="14" font-weight="700" text-anchor="middle">29.4 KB</text>

  <rect x="192" y="320" width="64" height="20" rx="8" fill="url(#withTool)"/>
  <text x="224" y="308" fill="#8fe4cd" font-size="14" font-weight="700" text-anchor="middle">4.3 KB</text>

  <text x="224" y="232" fill="#e5e7eb" font-size="16" font-weight="800" text-anchor="middle">6.9x</text>
  <text x="224" y="248" fill="#8b93a7" font-size="10" text-anchor="middle">smaller</text>

  <text x="183" y="362" fill="#e5e7eb" font-size="13" font-weight="600" text-anchor="middle">Task 1</text>
  <text x="183" y="377" fill="#8b93a7" font-size="11" text-anchor="middle">feature + blast radius</text>

  <!-- Task 2 -->
  <rect x="380" y="90" width="64" height="250" rx="8" fill="url(#noTool)"/>
  <text x="412" y="78" fill="#f5989d" font-size="14" font-weight="700" text-anchor="middle">53.5 KB</text>

  <rect x="462" y="321" width="64" height="19" rx="8" fill="url(#withTool)"/>
  <text x="494" y="309" fill="#8fe4cd" font-size="14" font-weight="700" text-anchor="middle">4.0 KB</text>

  <text x="494" y="178" fill="#e5e7eb" font-size="16" font-weight="800" text-anchor="middle">13.3x</text>
  <text x="494" y="194" fill="#8b93a7" font-size="10" text-anchor="middle">smaller</text>

  <text x="453" y="362" fill="#e5e7eb" font-size="13" font-weight="600" text-anchor="middle">Task 2</text>
  <text x="453" y="377" fill="#8b93a7" font-size="11" text-anchor="middle">fuzzy &#8220;where is X&#8221; search</text>
</svg>
