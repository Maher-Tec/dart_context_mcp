<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="noTool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2887a"/>
      <stop offset="100%" stop-color="#e5484d"/>
    </linearGradient>
    <linearGradient id="withTool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd8c4"/>
      <stop offset="100%" stop-color="#3fb88f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="640" height="420" rx="14" fill="#0f1420"/>

  <text x="28" y="38" fill="#e5e7eb" font-size="18" font-weight="700">Bytes read to accomplish the same task</text>
  <text x="28" y="58" fill="#8b93a7" font-size="12">dart_context_mcp vs. plain grep + full-file reads &#183; real 46-file Flutter project</text>

  <!-- legend -->
  <rect x="418" y="26" width="12" height="12" rx="3" fill="url(#noTool)"/>
  <text x="436" y="36" fill="#c7cede" font-size="12">No tool</text>
  <rect x="512" y="26" width="12" height="12" rx="3" fill="url(#withTool)"/>
  <text x="530" y="36" fill="#c7cede" font-size="12">With tool</text>

  <!-- baseline -->
  <line x1="60" y1="330" x2="600" y2="330" stroke="#232b3f" stroke-width="1"/>

  <!-- Task 1: feature + blast radius -->
  <text x="175" y="356" fill="#e5e7eb" font-size="13" font-weight="600" text-anchor="middle">Task 1</text>
  <text x="175" y="373" fill="#8b93a7" font-size="11" text-anchor="middle">understand a feature + blast radius</text>

  <rect x="120" y="187" width="70" height="143" rx="6" fill="url(#noTool)"/>
  <text x="155" y="177" fill="#f5989d" font-size="13" font-weight="700" text-anchor="middle">29.4 KB</text>

  <rect x="210" y="309" width="70" height="21" rx="6" fill="url(#withTool)"/>
  <text x="245" y="299" fill="#8fe4cd" font-size="13" font-weight="700" text-anchor="middle">4.3 KB</text>

  <text x="245" y="242" fill="#e5e7eb" font-size="15" font-weight="800" text-anchor="middle">6.9x</text>
  <text x="245" y="257" fill="#8b93a7" font-size="10" text-anchor="middle">smaller</text>

  <!-- Task 2: fuzzy search -->
  <text x="425" y="356" fill="#e5e7eb" font-size="13" font-weight="600" text-anchor="middle">Task 2</text>
  <text x="425" y="373" fill="#8b93a7" font-size="11" text-anchor="middle">fuzzy "find where X happens" search</text>

  <rect x="370" y="70" width="70" height="260" rx="6" fill="url(#noTool)"/>
  <text x="405" y="60" fill="#f5989d" font-size="13" font-weight="700" text-anchor="middle">53.5 KB</text>

  <rect x="460" y="310" width="70" height="20" rx="6" fill="url(#withTool)"/>
  <text x="495" y="300" fill="#8fe4cd" font-size="13" font-weight="700" text-anchor="middle">4.0 KB</text>

  <text x="495" y="175" fill="#e5e7eb" font-size="15" font-weight="800" text-anchor="middle">13.3x</text>
  <text x="495" y="190" fill="#8b93a7" font-size="10" text-anchor="middle">smaller</text>

  <text x="28" y="404" fill="#576082" font-size="11">Chars &#247; 4 &#8776; tokens. Full methodology and caveats: README &#183; "Token efficiency" section.</text>
</svg>
